# Standalone demo environment. Do not run alongside production with the same BOT_TOKEN.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expenses_demo}
      POSTGRES_USER: ${POSTGRES_USER:-expense_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expense_demo} -d ${POSTGRES_DB:-expenses_demo}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [demo_net]
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-expense_demo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-expenses_demo}
    depends_on:
      db:
        condition: service_healthy
    networks: [demo_net]
  bot:
    build: .
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-expense_demo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-expenses_demo}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [demo_net]
networks:
  demo_net:
volumes:
  demo_postgres_data:
