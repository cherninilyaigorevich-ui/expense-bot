name: CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: expense_user
          POSTGRES_PASSWORD: expense_test_password
          POSTGRES_DB: expenses_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U expense_user -d expenses_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BOT_TOKEN: "123456789:test_token"
      DATABASE_URL: >-
        postgresql+asyncpg://expense_user:expense_test_password@127.0.0.1:5432/expenses_test
      TEST_DATABASE_URL: >-
        postgresql+asyncpg://expense_user:expense_test_password@127.0.0.1:5432/expenses_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: |
          python -m compileall app

      - name: Run tests
        run: |
          pytest -v
